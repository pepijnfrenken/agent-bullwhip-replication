[tool.poetry]
name = "agent-bullwhip-replication"
version = "0.1.0"
description = "Replication + extension of arXiv 2605.17036 (agent bullwhip in LLM supply chains)"
authors = ["Pino"]

[tool.poetry.dependencies]
python = "^3.10"
requests = "^2.31"
numpy = "^1.26"
pandas = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
